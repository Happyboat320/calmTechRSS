# OpenAI-compatible Chat Completions 配置。
# 复制为 config/api.yml 后使用。建议把密钥放在环境变量里，不要直接写进仓库文件。
llm:
  enabled: true
  base_url: https://opencode.ai/zen/go/v1
  api_key_env: OPENAI_API_KEY
  model: deepseek-v4-pro
  temperature: 0.1
  timeout_seconds: 180
  max_retries: 5

# 聚类判别模型。默认沿用 llm 的 base_url 和 api_key_env，只覆盖模型名。
judge:
  enabled: true
  model: deepseek-v4-flash
  temperature: 0.0
  timeout_seconds: 180
  max_retries: 5

# GitHub Actions 默认没有 GPU，明确使用 CPU。
# 未安装 sentence-transformers 或模型不可用时，程序会自动回退到本地哈希向量。
embedding:
  model: intfloat/multilingual-e5-small
  models:
    - intfloat/multilingual-e5-small
    - sentence-transformers/all-MiniLM-L6-v2
  device: cpu
  batch_size: 32
  cpu_threads: 4
  max_chars: 2000
  similarity_threshold: 0.8

# 批处理并发设置。
pipeline:
  max_workers: 4
